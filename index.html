<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Password Generator</title>

    <!-- <a href="https://icons8.com/icon/EezKoqfhA0Ns/decision">Decision icon by Icons8</a> -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- JS -->
    <script type="module" defer src="assets/js/modules/digitalRain.js"></script>
    <script defer src="assets/js/modules/playMusic.js"></script>
    <script type="module" defer src="assets/js/main.js"></script>
  </head>

  <body>
    <main class="wrapper">
      <header>
        <h1>Password Generator</h1>
      </header>
      <div class="card">
        <textarea
          readonly
          id="password"
          class="card-body"
          placeholder="Your secure password"
          aria-label="Generated Password"
        ></textarea>
        <div class="card-footer">
          <div class="range-container">
            <label htmlFor="count" className="range-label">
              <input
                id="count"
                aria-label="count"
                name="count"
                min="8"
                max="128"
                value="16"
                type="range"
                className="range"
              />
            </label>
            128 characters
          </div>
          <div class="checkbox-container">
            <li>
              <label htmlFor="lowercase" className="checkbox-label">
                <input
                  id="lowercase"
                  aria-label="lowercase"
                  name="lowercase"
                  type="checkbox"
                  checked
                  className="checkbox"
                  readonly
                />
                Lowercase
              </label>
            </li>
            <li>
              <label htmlFor="uppercase" className="checkbox-label">
                <input
                  id="uppercase"
                  aria-label="uppercase"
                  name="uppercase"
                  type="checkbox"
                  checked
                  className="checkbox"
                  readonly
                />
                Uppercase
              </label>
            </li>
            <li>
              <label htmlFor="numbers" className="checkbox-label">
                <input
                  id="numbers"
                  aria-label="numbers"
                  name="numbers"
                  type="checkbox"
                  checked
                  className="checkbox"
                  readonly
                />
                Numbers
              </label>
            </li>
            <li>
              <label htmlFor="symbols" className="checkbox-label">
                <input
                  id="symbols"
                  aria-label="symbols"
                  name="symbols"
                  type="checkbox"
                  checked
                  className="checkbox"
                  readonly
                />
                Symbols
              </label>
            </li>
          </div>
          <button id="generate" class="btn">Generate Password</button>
        </div>
      </div>
    </main>
    <audio id="sfx"></audio>
    <audio
      autoplay
      id="music"
      src="assets/sounds/music.mp3"
      loop="loop"
      muted="true"
    ></audio>
    <div class="DigitalRainContainer">
      <canvas class="DigitalRain">
        A The Matrix-style wall of falling text.
      </canvas>
    </div>
  </body>
</html>
